[package]
name = "tabbar"
version = "0.2.0"
description = "Tabbar docked browser using the system webview"
authors = ["samya"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tabbar-core = { path = "../core" }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
